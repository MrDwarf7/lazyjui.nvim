name: Request Review
permissions:
  pull-requests: write
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
env:
  ACCOUNT_OWNER: mrdwarf7
jobs:
  # Generate a review request automatically when a pull request is 
  #   opened, reopened, marked as ready for review, or synchronized.
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request Review
        uses: actions/github-script@v7
        if: github.actor != env.ACCOUNT_OWNER
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              reviewers: [env.ACCOUNT_OWNER]
            });
